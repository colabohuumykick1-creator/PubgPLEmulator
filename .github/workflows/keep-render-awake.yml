name: Keep Render bot online

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Render health endpoint
        run: >-
          curl --fail --silent --show-error
          --max-time 60 --retry 2 --retry-delay 5
          https://pubgplemulator-eu.onrender.com/health
